<template>
  <div style="margin:auto; font-family:'Salesforce Sans','Open Sans',sans-serif;">

    <!-- Page Header -->
    <div style="padding:20px 0 10px 10px; margin-bottom:10px;font-size:24px;">
      <h1 style="margin:0;"><b>BC Health Authorities Health Protection Portal &#8212; Frequently Asked Questions (FAQs) </b></h1>  
      <span style="margin:0; color:#000000; font-size:16px; line-height:1.6;">Public Health Operations & Compliance System</span>
      
        <br/>
      <br/>
      <p style="margin:0; color:#000000; font-size:14px; line-height:1.6;">
        This FAQs has been developed to help members of the public understand the BC Health Authorities Health Protection Portal &#8212; a provincewide portal where inspection reports for licensed environmental health, water, community care facilities in British Columbia are published. The site also allows members of the public to submit complaints to the appropriate regional health authority.
      </p>
    </div>

    <!-- Outer accordion: 4 sections -->
    <div style="padding:0 10px;">
      <lightning-accordion  allow-multiple-sections-open>

        <!-- ═══ SECTION 1 ═══ -->
        <lightning-accordion-section  style="font-weight:bold;" name="s1" label="About the BC Health Authorities Health Protection Portal">
          <lightning-accordion allow-multiple-sections-open>

            <lightning-accordion-section style="font-weight:500;" name="q1" label="What is the BC Health Authorities Health Protection Portal?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The BC Health Authorities Health Protection Portal is a free, searchable website that anyone in British Columbia can use. The site lets you look up inspection reports for licensed, permitted, and some non-permitted facilities across the province - places like restaurants, daycares, and hair salons. You can also use the site to submit a complaint if you have a concern about a facility in your area.              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q2" label="Why did the BC government create this public reporting website?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The Government of British Columbia and all regional health authorities believe the public has a right to know how facilities are being managed and whether they are following health and safety rules. By making inspection reports available online, the public can learn more about how facilities like restaurants, daycares, pools, hair salons, etc. are managing their operations.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q3" label="What types of facilities are listed on the website?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The website includes facilities that are licensed, permitted, or approved under a range of provincial health legislation and regulations. This covers:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Community care and assisted living facilities (residential care, child care, group homes)</li>
                  <li style="list-style-type: disc;">Food service establishments (restaurants, cafeterias, food processing, catering operations)</li>
                  <li style="list-style-type: disc;">Drinking water systems (public water supplies, water haulers, and regulated water systems)</li>
                  <li style="list-style-type: disc;">Recreational water facilities (pools, hot tubs, spray parks, and similar facilities)</li>
                  <li style="list-style-type: disc;">Personal service establishments (salons, tattoo and piercing studios, spas)</li>
                  <li style="list-style-type: disc;">Tobacco and Vapour retailers</li>
                  <li style="list-style-type: disc;">Operating without License (OWL) Residential and Child Care Facilities</li>
                </ul>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q4" label="What information does the website show about each facility?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                For each facility, the website typically provides:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Facility name, address, and contact information</li>
                  <li style="list-style-type: disc;">Inspection reports</li>
                  <li style="list-style-type: disc;">Water sample information for drinking water systems, community care facilities, and recreational water facilities</li>
                </ul>
              </div>
            </lightning-accordion-section>

          </lightning-accordion>
        </lightning-accordion-section>

        <!-- ═══ SECTION 2 ═══ -->
        <lightning-accordion-section style="font-weight:Bold;" name="s2" label="Understanding Inspections">
          <lightning-accordion allow-multiple-sections-open>

            <lightning-accordion-section style="font-weight:500;" name="q5" label="What is the role of the Health Authority&apos;s regulatory and inspection programs?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                Each of the five regional health authorities in British Columbia are responsible for making sure that facilities in their area follow provincial health laws. The staff who carry out this work include Licensing Officers, Environmental Health Officers, and other authorized inspectors. Their jobs include:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Visiting and inspecting facilities</li>
                  <li style="list-style-type: disc;">Investigating complaints from the public</li>
                  <li style="list-style-type: disc;">Reviewing applications when someone wants to open a new facility</li>
                  <li style="list-style-type: disc;">Considering requests for exemptions from sections of the law</li>
                </ul>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q6" label="What laws and regulations govern inspections and licensing activities?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
               Health Authorities carry out inspections, investigations, and permit and licensing activities under provincial legislation designed to protect public health and safety. Depending on the type of facility or service, this may include legislation such as:
               <br/><b><u>PHOCS Programs</u></b>
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;"><b>Drinking Water:</b> Drinking Water Protection Act, Drinking Water Protection Regulation</li>
                  <li style="list-style-type: disc;"><b>Food Safety:</b>Public Health Act, Food Premises Regulation</li>
                  <li style="list-style-type: disc;"><b>Tobacco and Vaping:</b> Tobacco and Vapour Product Control Act, Tobacco and Vapour Products Control Regulation</li>
                  <li style="list-style-type: disc;"><b>Recreational Facilities:</b> Public Health Act, Pool Regulation </li>
                  <li style="list-style-type: disc;"><b>Personal Services:</b> Public Health Act, Personal Service Establishment Regulation</li>
                  <li style="list-style-type: disc;"><b>Child Care and Residential Care:</b>Community Care and Assisted Living Act, Child Care Licensing Regulation, Residential Care Regulation</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">The goal is always to protect the health and safety of the public. For more information access the BC Provincial website   <a href="https://www2.gov.bc.ca/gov/content/home" target="_blank" style="color:#1a5a96; text-decoration:underline;">Home - Province of British Columbia</a>.</p>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q7" label="What types of inspections will I see?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
               You may see the following types of inspection reports on the website: 
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;"><b>Initial inspection</b> &#8212; done when someone applies to open a new facility and all paperwork is ready</li>
                  <li style="list-style-type: disc;"><b>Routine inspection</b> &#8212; a full, detailed inspection of the whole facility, usually done without prior warning</li>
                  <li style="list-style-type: disc;"><b>Follow-up inspection</b> &#8212; done after routine inspection to check whether the facility fixed any problems or issues that were found, which are often to referred as a violation</li>
                  <li style="list-style-type: disc;"><b>Complaint inspection</b> &#8212; done when a complaint is filed against a facility, and the complaint is found to be true</li>
                  <li style="list-style-type: disc;"><b>Incident inspection</b> &#8212;  done when something serious happens at the facility, and the incident is found to be true</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">The inspection type can vary based on the program area you are viewing.</p>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q8" label="Are facilities notified before an inspection?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                Many routine inspections are conducted without prior notice. However, inspection practices may vary depending on the facility type, program area, or specific circumstances.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q9" label="What does a Licensing Officer look for during an inspection?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                During an inspection, the officer checks many different things depending on the type of facility. This may include:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Physical environment (safety, maintenance, cleanliness)</li>
                  <li style="list-style-type: disc;">Qualifications and records</li>
                  <li style="list-style-type: disc;">Policies and procedures</li>
                  <li style="list-style-type: disc;">Programming and services</li>
                  <li style="list-style-type: disc;">Health and safety practices</li>
                  <li style="list-style-type: disc;">Emergency management plans</li>
                  <li style="list-style-type: disc;">Compliance with all applicable legislation and regulations</li>
                </ul>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q10" label="What happens when a violation is found during an inspection?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                A violation is created when an officer finds that a facility is not in compliance with a rule or law. The inspection report will:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: number;">Describe what the officer observed and what rule was broken</li>
                  <li style="list-style-type: number;">Explain what the facility needs to do to fix it</li>
                  <li style="list-style-type: number;">Give a deadline for when the fix must be done</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">The officer will work with the facility operator to help them understand what needs to change. A follow-up inspection will be scheduled to check whether the violation has been fixed. If resolved, it will be noted in the follow-up report. If not, the violation will continue to appear on future reports until it is fixed.</p>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q11" label="Does a violation mean a facility is unsafe?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                Not necessarily. Violations can range from minor administrative issues to more significant health and safety concerns. Inspection reports provide details about the issue identified and any corrective action required.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q12" label="Why do some facilities remain open after violations are found?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                Not all violations require a facility to close. Health Authority staff assess the risk associated with the issue and determine the appropriate action. Facilities may continue operating while addressing lower-risk violations, while more serious situations may result in additional enforcement measures.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q13" label="What does the inspection report posted online show?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The online report is a summary of the inspection findings. Specifically, it shows:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">What rules were not being followed</li>
                  <li style="list-style-type: disc;">What the facility needs to do to fix the problem</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">Some follow-up reports are also posted, showing whether the issue was corrected. The information on the website is the same you would receive if you made a formal Freedom of Information request.</p>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q14" label="How current is the information on the website?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The website is updated regularly &#8212; usually within one business day after the health authority enters the data into their system, though sometimes it can take up to a week. Keep in mind that the report reflects what was found on the day of the inspection. If a facility fixed a problem after the inspection, that correction might not yet appear on the website. The health authority makes every effort to keep the information accurate, but small differences between what is posted online and the actual report on file can sometimes occur.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q15" label="Why can&apos;t I find a particular facility on the website?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                A facility may not appear on the website for several reasons:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">It may not be required to be licensed, permitted, or approved</li>
                  <li style="list-style-type: disc;">It may be a type of facility not covered by legislation or regulations</li>
                  <li style="list-style-type: disc;">Data entry for that facility may not yet have been completed</li>
                  <li style="list-style-type: disc;">Some facilities, like safe homes, are hidden from the public listing to protect the privacy and safety of the people who use them</li>
                  <li style="list-style-type: disc;">The facility may be permanently closed</li>
                  <li style="list-style-type: disc;">It may be operating without a licence or permit &#8212; in which case, contact your regional health authority</li>
                </ul>
              </div>
            </lightning-accordion-section>

          </lightning-accordion>
        </lightning-accordion-section>

        <!-- ═══ SECTION 3 ═══ -->
        <lightning-accordion-section style="font-weight:Bold;" name="s3" label="Submitting a Complaint or Concern">
          <lightning-accordion allow-multiple-sections-open>

            <lightning-accordion-section style="font-weight:500;" name="q16" label="Can I submit a complaint through this website?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                Yes. The BC Health Authorities Health Protection Portal includes a complaint submission function that submits your concern to the appropriate regional health authority based on the facility&apos;s location. Please look for the <b>&quot;Submit Feedback&quot;</b> button at the top of the navigation bar.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q17" label="What kinds of concerns or complaints can I submit?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                You can submit concerns or complaints related to any facility or service. Examples include:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Abuse, neglect, or unsafe conditions in a community care or assisted living facility</li>
                  <li style="list-style-type: disc;">Unsanitary food handling, storage, or preparation at a food service establishment</li>
                  <li style="list-style-type: disc;">Water quality or safety concerns related to a regulated drinking water system</li>
                  <li style="list-style-type: disc;">Unsafe or poorly maintained pools, hot tubs, or recreational water facilities</li>
                  <li style="list-style-type: disc;">Unsanitary practices at personal service establishments</li>
                  <li style="list-style-type: disc;">Any facility believed to be operating without a required license or permit</li>
                  <li style="list-style-type: disc;">Any other health or safety concern related to a regulated facility or service</li>
                </ul>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q18" label="What happens after I submit a complaint?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                All complaints are reviewed by the appropriate program area and taken seriously. The assigned officer may:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Review relevant documents, records, and policies</li>
                  <li style="list-style-type: disc;">Inspect the facility or premises</li>
                  <li style="list-style-type: disc;">Interview staff, operators, or other relevant parties</li>
                  <li style="list-style-type: disc;">Involve other agencies as required</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">Following the investigation, the operator or facility will receive written communication outlining the findings. If violations are identified, the operator will be given a specific timeframe to address them.</p>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q19" label="Will my complaint be kept confidential?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                When you submit a complaint, you can request to be anonymous, or you can provide your contact information for a follow-up. Health authorities make every effort to protect the identity of complainants throughout the investigation process. However, in some circumstances &#8212; for example, where the nature of the complaint makes the complainant identifiable &#8212; complete anonymity cannot always be guaranteed. If you have concerns about confidentiality, discuss them with the officer when you submit your complaint.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q20" label="Will I receive updates about my complaint?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                If you provide contact information when submitting a complaint, the Health Authority may contact you for additional information. Due to privacy requirements, details about investigations or enforcement actions may not always be shared.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q21" label="How do I contact the correct Licensing Office for my region?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The BC Health Authorities Health Protection Portal will automatically direct your complaint to the appropriate health authority based on the facility location you select. You can also contact the regional health authorities directly:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Interior Health</li>
                  <li style="list-style-type: disc;">Vancouver Coastal Health</li>
                  <li style="list-style-type: disc;">Fraser Health</li>
                  <li style="list-style-type: disc;">Island Health</li>
                  <li style="list-style-type: disc;">Northern Health</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">Contact details for each regional office are available on this website and on each health authority&apos;s website.</p>
              </div>
            </lightning-accordion-section>

          </lightning-accordion>
        </lightning-accordion-section>

        <!-- ═══ SECTION 4 ═══ -->
        <lightning-accordion-section style="font-weight:bold;" name="s4" label="Using the Website">
          <lightning-accordion allow-multiple-sections-open>

            <lightning-accordion-section style="font-weight:500;" name="q22" label="How do I search for a facility on the BC Health Authorities Health Protection Portal?">
              <div style="color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                You can search for facilities using the search function on the BC Health Authorities Health Protection Portal. Search options typically include:
                <ul style="margin:10px 0 0 20px;">
                  <li style="list-style-type: disc;">Facility name</li>
                  <li style="list-style-type: disc;">City, municipality, or region</li>
                  <li style="list-style-type: disc;">Facility type</li>
                  <li style="list-style-type: disc;">Health authority region</li>
                </ul>
                <p style="margin-top:12px; font-size:14px;">Search results will display matching facilities and allow you to view their inspection history, contact information, and capacity.</p>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q23" label="Where does the data on the website come from?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                All data on the website comes from BC&apos;s five regional health authorities. Information is entered and maintained by authorized staff across each health authority&apos;s regulatory and inspection programs and is uploaded to the public portal on an ongoing basis.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q24" label="Can I search for closed facilities?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                Closed facilities may not appear in search results. Availability of historical information depends on Health Authority policies and data retention practices.
              </p>
            </lightning-accordion-section>

            <lightning-accordion-section style="font-weight:500;" name="q25" label="How often is the information updated?">
              <p style="margin:0; color:#000000; font-size:14px; line-height:1.6; padding:4px 0 8px 0;">
                The website is updated on a regular basis &#8212; typically within one business day after data entry is completed. Because information is valid at the time of inspection, corrections made by a facility after an inspection date may not yet appear on the site. If you believe there is an error in the information posted for a facility, contact the applicable regional Licensing Office.
              </p>
            </lightning-accordion-section>

          </lightning-accordion>
        </lightning-accordion-section>

      </lightning-accordion>
    </div>

    <!-- Back to Top -->
    <div style="padding:32px 10px 40px 10px; text-align:right;">
      <button onclick={scrollToTop}
              style="display:inline-flex; align-items:center; gap:8px; background:#ffffff; color:#1a5a96; border:1px solid #1a5a96; padding:6px 16px; cursor:pointer; font-family:'Salesforce Sans','Open Sans',sans-serif; font-size:14px;">
        <span style="font-size:14px; color:#1a5a96;">&#8593;</span>
        <span style="color:#1a5a96;">Back to top</span>
      </button>
    </div>

  </div>
</template>
