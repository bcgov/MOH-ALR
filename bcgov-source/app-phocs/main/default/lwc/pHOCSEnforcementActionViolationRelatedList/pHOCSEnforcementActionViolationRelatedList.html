<template>
    <div class="related-list-container">

        <!-- Header -->
        <div class="related-list-header slds-grid slds-grid_vertical-align-center">

            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon
                        icon-name="standard:record"
                        size="small">
                    </lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-text-heading_small slds-truncate related-list-title">
                        Related Violations ({recordCount})
                    </h2>
                </div>
            </div>

            <!-- Refresh + New buttons -->
            <div class="slds-no-flex slds-grid slds-grid_vertical-align-center header-actions">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh"
                    title="Refresh"
                    size="small"
                    onclick={handleRefresh}
                    class="slds-m-right_x-small">
                </lightning-button-icon>
                <lightning-button
                    label="New"
                    disabled={isReadOnly}
                    onclick={handleNew}>
                </lightning-button>
            </div>
        </div>

        <!-- Datatable -->
        <template if:true={hasRecords}>
            <div class="table-wrapper">
                <template if:true={isTableVisible}>
                    <lightning-datatable
                        key-field="Id"
                        data={violations}
                        columns={columns}
                        hide-checkbox-column
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </template>
            </div>
        </template>

        <template if:false={hasRecords}>
            <div class="slds-text-color_weak slds-p-around_medium slds-text-align_center empty-state">
                No related violations found.
            </div>
        </template>

    </div>
</template>
