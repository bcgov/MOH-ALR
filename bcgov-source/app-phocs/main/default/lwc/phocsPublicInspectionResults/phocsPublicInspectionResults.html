<template>
    <template if:true={hasRows}>
        <div class="inspection-results-table-wrapper">
            <table class="slds-table slds-table_cell-buffer inspection-results-table">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th class="question-column slds-theme_shade" scope="col" aria-sort={questionAriaSort}>
                            <button class="sort-button" type="button" data-field="question" onclick={handleSort}>
                                <span class="slds-truncate">
                                    Inspection Questions and Comments
                                </span>
                                <lightning-icon
                                    class="sort-icon"
                                    icon-name={questionSortIcon}
                                    size="xx-small"
                                    alternative-text={questionSortAlternativeText}>
                                </lightning-icon>
                            </button>
                        </th>

                        <th class="status-column slds-theme_shade" scope="col" aria-sort={statusAriaSort}>
                            <button class="sort-button" type="button" data-field="Status" onclick={handleSort}>
                                <span class="slds-truncate">
                                    Compliance Status
                                </span>
                                <lightning-icon
                                    class="sort-icon"
                                    icon-name={statusSortIcon}
                                    size="xx-small"
                                    alternative-text={statusSortAlternativeText}>
                                </lightning-icon>
                            </button>
                        </th>
                    </tr>
                </thead>

                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.Id}>
                            <td class="question-column">
                                <div class="question">
                                    {row.question}
                                </div>

                                <template if:true={row.comments.length}>
                                    <ul class="comments-list">
                                        <template for:each={row.comments} for:item="comment">
                                            <li key={comment}>
                                                {comment}
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </td>

                            <td class="status-column">
                                {row.Status}
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>
