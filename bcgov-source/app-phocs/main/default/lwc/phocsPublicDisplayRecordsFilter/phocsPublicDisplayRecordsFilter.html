<template>
    <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; text:bold;">

        <!-- Dynamic Filters -->
        <template for:each={filterConfig} for:item="filter">
            <template if:true={filter.visible}>
                <div key={filter.field} class="filterContainer">

                    <div class="customLabel">
                        {filter.label}
                    </div>
                    <lightning-combobox variant="label-hidden" options={filter.options} data-field={filter.field}
                        value={filter.value} onchange={handleChange}>
                    </lightning-combobox>
                </div>
            </template>
        </template>

        <!-- Reset Button -->
        <div class="slds-size_1-of-6">
        <lightning-button stretch label="Reset" onclick={handleReset}>
        </lightning-button>
        </div>

    </div>
</template>
