name: PR Code Validation
on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'Validation scope (manual runs only)'
        type: choice
        options:
          - delta
          - full
        default: delta
  pull_request:
    branches:
      - dev
    paths:
      - 'bcgov-source/app-phocs/main/default**'
      - 'bcgov-source/core/main/default**'
      - 'bcgov-source/app-alr/main/default**'  
      - '.github/workflows/PR_Code_Validation.yml'
      - '!sfdx-project.json'
jobs:
  Code-Validation-Run:
    runs-on: ubuntu-latest
    strategy:
      # By default, if any job in a matrix fails, all other jobs are immediately cancelled. This makes the jobs run to completion instead.
      fail-fast: false
    timeout-minutes: 60
    steps:
      # === Setup. We need to get the code, set up nodejs, and create the results directory. ===
      - uses: actions/checkout@v4
        with:
          # Full history is required so sfdx-git-delta can diff against the PR base commit.
          fetch-depth: 0
    #  ✅ Set correct Node.js version (required by scanner)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: mkdir smoke-test-results
      
      # === Make three attempts to install sfdx ===
      - name: Install Salesforce CLI (official)
        run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir ~/sf
          tar xJf sf-linux-x64.tar.xz -C ~/sf --strip-components 1
          echo "$HOME/sf/bin" >> $GITHUB_PATH

      - name: Verify CLI
        run: sf --version

      # === Attempt to install the scanner plugin ===
      - name: Install Scanner Plugin
        run: sf plugins install @salesforce/sfdx-scanner

      # === Log the installed plugins for easier debugging ===
      - name: Log plugins
        run: sf plugins

      # === Static Code Analysis ===
      - name: Run static apexunit validations
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --pmdconfig ruleset/apexunit.xml --format table --engine pmd --normalize-severity --severity-threshold 1

      - name: Run static braces validations
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --format table --pmdconfig ruleset/braces.xml

      - name: Run static complexity validations
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --format table --pmdconfig ruleset/complexity.xml

      # === Attempt to execute static source validations ===
      - name: Run static empty source validations
        id: static_tests_empty
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --format "table" --pmdconfig "ruleset/empty.xml"

      # === Attempt to execute static source validations ===
      - name: Run static complexity source validations
        id: static_tests_metrics
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --format "table" --pmdconfig "ruleset/metrics.xml"

      # === Attempt to execute static source validations ===
      - name: Run static security source validations
        id: static_tests_security
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --format "table" --pmdconfig "ruleset/security.xml"

      # === Attempt to execute static source validations ===
      - name: Run static style source validations
        id: static_tests_style
        run: sf scanner run --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}" --format "table" --pmdconfig "ruleset/style.xml"

      # === Attempt to execute lint source validations ===
      - name: Run lint empty source validations
        id: lint_tests
        run: sf scanner run --engine eslint-lwc --target "${{ vars.RELEASE_PIPELINE_SOURCEPATH }}"

      # Authenticate CI01 sandbox
      - name: 'Authenticate CI01 Sandbox'
        run: |
            echo "${{ secrets.CI_SFDXAUTHURL }}" > ./authfile
            sf org login sfdx-url -f authfile -a CI01

      # === Generate a delta package containing only the components changed in this PR ===
      # Delta path runs for PRs and for manual runs left on the default 'delta' mode.
      # A manual run with validation_mode=full skips these and uses "Validate Code (full)" below.
      - name: Install sfdx-git-delta plugin
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode != 'full'
        run: |
          # sfdx-git-delta is unsigned; pre-approve it so the CLI doesn't prompt (no TTY in CI).
          mkdir -p ~/.config/sf
          echo '["sfdx-git-delta"]' > ~/.config/sf/unsignedPluginAllowList.json
          sf plugins install sfdx-git-delta

      - name: Generate delta package
        id: delta
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode != 'full'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # Fallback for workflow_dispatch runs (no PR context): diff against dev.
          if [ -z "$BASE_SHA" ]; then BASE_SHA="origin/dev"; fi
          echo "Generating delta from $BASE_SHA to HEAD"
          mkdir -p changed-sources
          sf sgd source delta --to HEAD --from "$BASE_SHA" \
            --output-dir changed-sources --generate-delta --source bcgov-source
          echo "----- Delta package.xml -----"
          cat changed-sources/package/package.xml
          if grep -q "<types>" changed-sources/package/package.xml; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Delta validation::No deployable metadata changes under bcgov-source — validation skipped."
          fi

      - name: Validate Code (delta + object dependencies)
        if: steps.delta.outputs.has_changes == 'true'
        id: run_code_validation
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then BASE_SHA="origin/dev"; fi
          # Build the set of deployable paths from changed files. Directory-based components
          # (objects, lwc, aura bundles) are expanded to their FULL folder so dependent
          # metadata is validated together — e.g. changing a field also re-validates the
          # record types that reference it (catches inactive-picklist-value style errors).
          declare -A PATHS
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              */objects/*) unit=$(echo "$f" | sed -E 's#(.*/objects/[^/]+)/.*#\1#') ;;
              */lwc/*)     unit=$(echo "$f" | sed -E 's#(.*/lwc/[^/]+)/.*#\1#') ;;
              */aura/*)    unit=$(echo "$f" | sed -E 's#(.*/aura/[^/]+)/.*#\1#') ;;
              *)           unit="$f" ;;
            esac
            PATHS["$unit"]=1
          done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'bcgov-source/')

          if [ ${#PATHS[@]} -eq 0 ]; then
            echo "No added/modified deployable paths after expansion — nothing to validate."
            exit 0
          fi

          ARGS=()
          echo "Validating these paths (objects/lwc/aura expanded for dependency checks):"
          for p in "${!PATHS[@]}"; do echo "  - $p"; ARGS+=(--source-dir "$p"); done

          # Native, human-readable output (--verbose, no --json)
          sf project deploy start "${ARGS[@]}" \
            --wait 60 --dry-run --test-level RunLocalTests --verbose -g --target-org CI01

      # === Capture the just-completed validation as JSON for the report/artifacts/summary ===
      - name: Capture validation result (JSON)
        if: always() && steps.delta.outputs.has_changes == 'true'
        run: |
          sf project deploy report --use-most-recent --json > deploy-result.json 2>/dev/null || echo '{}' > deploy-result.json

      # === Convert the raw JSON result into a human-readable Markdown report ===
      - name: Build validation report
        if: always() && steps.delta.outputs.has_changes == 'true'
        run: |
          COUNT=$(jq -r '[.result.files[]? | "\(.type)/\(.fullName)"] | unique | length' deploy-result.json 2>/dev/null || echo 0)
          RUN=$(jq -r '.result.details.runTestResult.numTestsRun // 0' deploy-result.json 2>/dev/null || echo 0)
          FAIL=$(jq -r '.result.details.runTestResult.numFailures // 0' deploy-result.json 2>/dev/null || echo 0)
          TIME=$(jq -r '.result.details.runTestResult.totalTime // 0' deploy-result.json 2>/dev/null || echo 0)
          STATUS=$(jq -r 'if .result.success then "Succeeded" else "Failed" end' deploy-result.json 2>/dev/null || echo Unknown)
          {
            echo "# Salesforce Delta Validation Report"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | $STATUS (dry-run) |"
            echo "| Target org | CI01 |"
            echo "| Test level | RunLocalTests |"
            echo "| Components validated | $COUNT |"
            echo "| Apex tests run | $RUN |"
            echo "| Test failures | $FAIL |"
            echo "| Test time (ms) | $TIME |"
            echo ""
            echo "## Components Validated"
            echo ""
            echo "| Type | Component | State |"
            echo "| --- | --- | --- |"
            jq -r '[.result.files[]?] | unique_by("\(.type)/\(.fullName)") | .[] | "| \(.type) | \(.fullName) | \(.state // "n/a") |"' deploy-result.json 2>/dev/null || true
            echo ""
            echo "## Component Errors"
            echo ""
            ERRROWS=$(jq -r '.result.details.componentFailures[]? | "| \(.componentType) | \(.fullName) | \(.problem | gsub("[\\r\\n|]"; " ")) | \(.fileName // "n/a"):\(.lineNumber // "?") |"' deploy-result.json 2>/dev/null || true)
            if [ -n "$ERRROWS" ]; then
              echo "| Type | Component | Problem | Location |"
              echo "| --- | --- | --- | --- |"
              echo "$ERRROWS"
            else
              echo "_No component errors._"
            fi
            echo ""
            echo "## Apex Test Failures"
            echo ""
            FAILROWS=$(jq -r '.result.details.runTestResult.failures[]? | "| \(.name) | \(.methodName) | \(.message | gsub("[\\r\\n|]"; " ")) |"' deploy-result.json 2>/dev/null || true)
            if [ -n "$FAILROWS" ]; then
              echo "| Class | Method | Message |"
              echo "| --- | --- | --- |"
              echo "$FAILROWS"
            else
              echo "_No test failures._"
            fi
            echo ""
            echo "## Code Coverage Warnings"
            echo ""
            COVWARN=$(jq -r '.result.details.runTestResult.codeCoverageWarnings[]? | "- \(.name // "Overall"): \(.message)"' deploy-result.json 2>/dev/null || true)
            if [ -n "$COVWARN" ]; then
              echo "$COVWARN"
            else
              echo "_None._"
            fi
          } > validation-report.md
          echo "Wrote validation-report.md"

      - name: Upload delta package & components
        if: always() && steps.delta.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delta-package
          retention-days: 21
          path: changed-sources/

      - name: Upload validation result
        if: always() && steps.delta.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-result
          retention-days: 21
          path: |
            validation-report.md
            deploy-result.json

      - name: Publish validation summary
        if: always() && steps.delta.outputs.has_changes == 'true'
        run: |
          RUN=$(jq -r '.result.details.runTestResult.numTestsRun // 0' deploy-result.json 2>/dev/null || echo 0)
          FAIL=$(jq -r '.result.details.runTestResult.numFailures // 0' deploy-result.json 2>/dev/null || echo 0)
          # Failure detail rows (component errors + Apex test failures), shown only when present.
          CFAIL=$(jq -r '.result.details.componentFailures[]? | "| <sub>\(.componentType) \(.fullName)</sub> | <sub>\(.problem | gsub("[\\r\\n|]"; " "))</sub> |"' deploy-result.json 2>/dev/null || true)
          TFAIL=$(jq -r '.result.details.runTestResult.failures[]? | "| <sub>\(.name).\(.methodName)</sub> | <sub>\(.message | gsub("[\\r\\n|]"; " "))</sub> |"' deploy-result.json 2>/dev/null || true)
          # Summary lists ONLY the components changed in this PR (from the sgd delta package.xml),
          # not the expanded set that was validated. The full validated set stays in the report.
          mapfile -t CHANGED < <(awk '
            /<members>/ { v=$0; sub(/.*<members>/,"",v); sub(/<\/members>.*/,"",v); m[++n]=v }
            /<name>/    { v=$0; sub(/.*<name>/,"",v);    sub(/<\/name>.*/,"",v);    for (i=1;i<=n;i++) print v"\t"m[i]; n=0 }
          ' changed-sources/package/package.xml 2>/dev/null)
          {
            echo "### Delta Validation Summary"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| <sub>Components changed</sub> | <sub>${#CHANGED[@]}</sub> |"
            echo "| <sub>Apex tests run</sub> | <sub>$RUN</sub> |"
            echo "| <sub>Test failures</sub> | <sub>$FAIL</sub> |"
            echo ""
            echo "#### Changed Components"
            echo ""
            echo "| Type | Component |"
            echo "| --- | --- |"
            for row in "${CHANGED[@]}"; do
              echo "| <sub>${row%%$'\t'*}</sub> | <sub>${row#*$'\t'}</sub> |"
            done
            if [ -n "$CFAIL" ] || [ -n "$TFAIL" ]; then
              echo ""
              echo "#### Failures"
              echo ""
              echo "| Component / Test | Problem |"
              echo "| --- | --- |"
              if [ -n "$CFAIL" ]; then echo "$CFAIL"; fi
              if [ -n "$TFAIL" ]; then echo "$TFAIL"; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # === Full validation: manual runs only, when validation_mode=full. Validates the entire codebase. ===
      - name: Validate Code (full)
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'full'
        run: sf project deploy start --source-dir bcgov-source/app-phocs/main/default --source-dir bcgov-source/core/main/default --source-dir bcgov-source/app-alr/main/default --wait 60 --dry-run --test-level RunLocalTests --verbose -g --target-org CI01
