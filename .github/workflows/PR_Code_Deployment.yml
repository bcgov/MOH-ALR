name: PR Code Deployment

# Definition when the workflow should run
on:
  workflow_dispatch:
  push:
    branches:
        - dev
    paths:
        - 'bcgov-source/app-phocs/main/default**'
        - 'bcgov-source/core/main/default**'
        - 'bcgov-source/app-alr/main/default**'             
        - '.github/workflows/PR_Code_Deployment.yml'
        - '!sfdx-project.json'

# Jobs to be executed
jobs:
  Code-Deploy-Run:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: CI
    env:
      SFDXAUTHURL: ${{ secrets.SFDXAUTHURL }}
    steps:
      # Install Salesforce CLI
      - name: 'Install Salesforce CLI'
        run: |
          npm install @salesforce/cli --global
      # Checkout the source code
      - name: 'Checkout source code'
        uses: actions/checkout@v7

      # Authenticate sandbox
      - name: 'Authenticate Sandbox'
        run: |
            echo "${{ env.SFDXAUTHURL }}" > ./authfile
            sf org login sfdx-url -f authfile -a CI

      - name: Cleanup auth file
        if: always()
        run: rm -f authFile

      # deploy code without running test classes
      - name: 'Deploy source code'
        run: sf project deploy start --wait 60 --concise --ignore-conflicts --ignore-warnings --target-org CI --source-dir ${{ vars.RELEASE_PIPELINE_SOURCEPATH }}